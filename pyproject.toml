[project]
name = "finance-advisor-agent"
version = "0.1.0"
description = "Local-only personal finance advisor agent: statement ingestion, allocation drift tracking, and periodic rebalancing reports."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
